<div class="user-list-container">
  <h2>Lista użytkowników</h2>

  <input
    type="text"
    placeholder="Filtruj użytkowników"
    [(ngModel)]="filter"
    class="filter-input"
  />

  <ul class="user-list">
    <li
      *ngFor="let user of filteredUsers"
      (click)="onUserClick(user)"
      class="user-item"
    >
      {{ user.username }}
    </li>
  </ul>
</div>
